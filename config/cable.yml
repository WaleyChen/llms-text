# Use solid_cable in development so broadcasts from a separate job process (bin/jobs)
# reach the browser. With adapter: async, only the same process receives broadcasts.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.hour

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
