# Use solid_cable so broadcasts from the job process (Solid Queue) reach the browser
# via the cable DB. Ensure cable DB exists: bin/rails db:prepare
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.hour

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
